name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests & static guards
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect applied migration history
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "No usable base SHA; migration history diff guard skipped."
            exit 0
          fi
          CHANGED="$(git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- supabase/migrations | awk '$1 !~ /^A/ {print}')"
          if [ -n "$CHANGED" ]; then
            echo "Existing migration files are immutable. Add a new forward migration instead:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and parser regression tests
        run: bun test

      - name: Setup Rust for native parity gate
        uses: dtolnay/rust-toolchain@stable

      - name: Verify native objective-vector parity
        run: rustc --edition=2021 --test desktop/src-tauri/src/objective.rs -o /tmp/okulos-objective-test && /tmp/okulos-objective-test

      - name: Setup Python for CP-SAT oracle
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OR-Tools oracle dependency
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206

      - name: Run CP-SAT exact oracle gate
        run: PYTHONPATH=tools python tools/test_schedule_cpsat_oracle.py

      - name: Run 30-seed world benchmark gate
        run: bun tools/schedule_world_benchmark.ts --ci --replay-all --out /tmp/schedule-world-benchmark.json

      - name: Report final parity truth gate
        run: bun tools/schedule_parity_gate.ts

      - name: Upload world benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: schedule-world-benchmark-${{ github.sha }}
          path: /tmp/schedule-world-benchmark.json
          retention-days: 30

      - name: Audit canonical schedule schema references
        run: node scripts/report-schedule-schema-references.mjs --ci --out /tmp/schedule-schema-reference-audit.json

      - name: Upload canonical schema reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: schedule-schema-reference-${{ github.sha }}
          path: /tmp/schedule-schema-reference-audit.json
          retention-days: 30

      - name: Check Supabase migrations
        run: node scripts/check-migrations.mjs

      - name: Audit legacy migration replay safety
        run: node scripts/check-migration-replay-safety.mjs

      - name: Check existing module tenant wiring
        run: node scripts/check-existing-module-tenant-wiring.mjs

      - name: Check authenticated entry gate
        run: node scripts/check-authenticated-entry.mjs

      - name: Check route access map
        run: node scripts/check-route-access-map.mjs

      - name: Check timetable migration authority
        run: node scripts/check-timetable-authority.mjs

      - name: Check timetable edge-slot policy
        run: node scripts/check-schedule-edge-slots.mjs

      - name: Check timetable Phase 2 closure
        run: node scripts/check-schedule-phase2.mjs

      - name: Check timetable Phase 3 closure
        run: node scripts/check-schedule-phase3.mjs

      - name: Check Phase 4 testing closure
        run: node scripts/check-phase4-testing.mjs

      - name: Check Phase 5 reporting closure
        run: node scripts/check-phase5-reporting.mjs

      - name: Check auth flow
        run: node scripts/check-auth-flow.mjs

      - name: Check delegated permission flow
        run: node scripts/check-permission-flow.mjs

      - name: Production build and generate routes
        run: bun run build

      - name: Check generated route tree
        run: node scripts/check-route-tree-consistency.mjs

      - name: TypeScript check
        run: bunx tsc --noEmit

  migration-policy:
    name: Forward migration policy
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit replay baseline requirement
        run: node scripts/check-migration-replay-safety.mjs
