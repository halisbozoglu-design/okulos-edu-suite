name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests & static guards
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect applied migration history
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "No usable base SHA; migration history diff guard skipped."
            exit 0
          fi
          CHANGED="$(git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- supabase/migrations | awk '$1 !~ /^A/ {print}')"
          if [ -n "$CHANGED" ]; then
            echo "Existing migration files are immutable. Add a new forward migration instead:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and parser regression tests
        run: bun test

      - name: Check Supabase migrations
        run: node scripts/check-migrations.mjs

      - name: Check existing module tenant wiring
        run: node scripts/check-existing-module-tenant-wiring.mjs

      - name: Check authenticated entry gate
        run: node scripts/check-authenticated-entry.mjs

      - name: Check route access map
        run: node scripts/check-route-access-map.mjs

      - name: Check timetable migration authority
        run: node scripts/check-timetable-authority.mjs

      - name: Check timetable edge-slot policy
        run: node scripts/check-schedule-edge-slots.mjs

      - name: Check timetable Phase 2 closure
        run: node scripts/check-schedule-phase2.mjs

      - name: Check timetable Phase 3 closure
        run: node scripts/check-schedule-phase3.mjs

      - name: Check Phase 4 testing closure
        run: node scripts/check-phase4-testing.mjs

      - name: Check auth flow
        run: node scripts/check-auth-flow.mjs

      - name: Check delegated permission flow
        run: node scripts/check-permission-flow.mjs

      - name: Production build and generate routes
        run: bun run build

      - name: Check generated route tree
        run: node scripts/check-route-tree-consistency.mjs

      - name: TypeScript check
        run: bunx tsc --noEmit

  database:
    name: Clean database migration & RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Start clean local Supabase
        run: supabase start

      - name: Rebuild database from migration zero
        run: supabase db reset --local --no-seed

      - name: Run migrated schema contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/sql/phase4_schema_contract.sql

      - name: Run tenant isolation integration test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/sql/phase4_tenant_isolation.sql

      - name: Run timetable RPC boundary smoke test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/sql/phase4_timetable_rpc_boundaries.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
