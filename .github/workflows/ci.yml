name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase migrations
        run: node scripts/check-migrations.mjs

      - name: Check timetable migration authority
        continue-on-error: true
        run: node scripts/check-timetable-authority.mjs

      - name: Check auth flow
        run: node scripts/check-auth-flow.mjs

      - name: Check delegated permission flow
        run: node scripts/check-permission-flow.mjs

      - name: Production build and generate routes
        run: bun run build

      - name: TypeScript check
        run: bunx tsc --noEmit
