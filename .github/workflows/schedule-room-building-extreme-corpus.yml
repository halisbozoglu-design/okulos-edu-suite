name: Schedule room building extreme corpus

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/schedule-local-solver-incremental-core.ts'
      - 'src/lib/schedule-local-solver-time-core.ts'
      - 'src/lib/schedule-local-incremental-score.ts'
      - 'tools/schedule_room_building_extreme_corpus.ts'
      - 'tests/schedule-room-building-extreme-corpus.test.ts'
      - 'tests/schedule-time-room-joint.test.ts'
      - 'benchmarks/room-building-extreme/**'
      - 'docs/SCHEDULE_FINAL_MASTER_TREE_20260828.md'
      - '.github/workflows/schedule-room-building-extreme-corpus.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/schedule-local-solver-incremental-core.ts'
      - 'src/lib/schedule-local-solver-time-core.ts'
      - 'src/lib/schedule-local-incremental-score.ts'
      - 'tools/schedule_room_building_extreme_corpus.ts'
      - 'tests/schedule-room-building-extreme-corpus.test.ts'
      - 'tests/schedule-time-room-joint.test.ts'
      - 'benchmarks/room-building-extreme/**'
      - 'docs/SCHEDULE_FINAL_MASTER_TREE_20260828.md'
      - '.github/workflows/schedule-room-building-extreme-corpus.yml'

permissions:
  contents: read

concurrency:
  group: schedule-room-building-extreme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: 3 room/building profiles x 7 deterministic seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run targeted structural tests
        run: bun test tests/schedule-time-room-joint.test.ts tests/schedule-room-building-extreme-corpus.test.ts
      - name: Run 21-case room building gate
        run: bun tools/schedule_room_building_extreme_corpus.ts --seeds 7 --out /tmp/schedule-room-building-extreme.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-room-building-extreme-${{ github.sha }}
          path: /tmp/schedule-room-building-extreme.json
          if-no-files-found: error
          retention-days: 90
