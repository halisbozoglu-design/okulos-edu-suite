name: Deploy Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Dry-run and deploy production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: mndbkmagrjxcoxdetzdl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify repository target
        shell: bash
        run: |
          grep -Eq '^project_id = "mndbkmagrjxcoxdetzdl"$' supabase/config.toml || {
            echo 'supabase/config.toml does not target production project';
            exit 1;
          }

      - name: Link production project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Verify migration ledger
        run: supabase migration list --linked
