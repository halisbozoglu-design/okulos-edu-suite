name: Schedule 101-seed stress benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/schedule_world_benchmark.ts'
      - 'tests/schedule-world-benchmark-package.test.ts'
      - 'benchmarks/world/manifest.json'
      - '.github/workflows/schedule-world-stress.yml'
  push:
    branches: [main]
    paths:
      - 'tools/schedule_world_benchmark.ts'
      - 'tests/schedule-world-benchmark-package.test.ts'
      - 'benchmarks/world/manifest.json'
      - '.github/workflows/schedule-world-stress.yml'

permissions:
  contents: read

concurrency:
  group: schedule-world-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: 6 profiles x 101 deterministic seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run 606-case stress gate
        run: bun tools/schedule_world_benchmark.ts --ci --seeds 101 --min-seeds 100 --out /tmp/schedule-world-stress.json

      - name: Verify stress evidence shape
        run: |
          bun -e 'const r=await Bun.file("/tmp/schedule-world-stress.json").json(); if(r.seed_count!==101||r.results.length!==6||r.results.some(x=>x.runs!==101)) throw new Error("STRESS_EVIDENCE_SHAPE_FAILED")'

      - name: Upload stress evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-world-stress-${{ github.sha }}
          path: /tmp/schedule-world-stress.json
          if-no-files-found: error
          retention-days: 90
