name: Schedule vocational maximum-complexity corpus

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/schedule-local-solver-incremental-core.ts'
      - 'src/lib/schedule-local-solver-time-core.ts'
      - 'src/lib/schedule-local-hotspot-index.ts'
      - 'src/lib/schedule-local-incremental-score.ts'
      - 'tools/schedule_vocational_max_complex_corpus.ts'
      - 'tests/schedule-vocational-max-complex-corpus.test.ts'
      - 'tests/schedule-time-room-joint.test.ts'
      - 'benchmarks/vocational-max-complex/**'
      - 'docs/SCHEDULE_FINAL_MASTER_TREE_20260828.md'
      - '.github/workflows/schedule-vocational-max-complex-corpus.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/schedule-local-solver-incremental-core.ts'
      - 'src/lib/schedule-local-solver-time-core.ts'
      - 'src/lib/schedule-local-hotspot-index.ts'
      - 'src/lib/schedule-local-incremental-score.ts'
      - 'tools/schedule_vocational_max_complex_corpus.ts'
      - 'tests/schedule-vocational-max-complex-corpus.test.ts'
      - 'tests/schedule-time-room-joint.test.ts'
      - 'benchmarks/vocational-max-complex/**'
      - 'docs/SCHEDULE_FINAL_MASTER_TREE_20260828.md'
      - '.github/workflows/schedule-vocational-max-complex-corpus.yml'

permissions:
  contents: read

concurrency:
  group: schedule-vocational-max-complex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: 3 combined profiles x 7 seeds plus fail-closed cases
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run focused subgroup, pool and corpus tests
        run: bun test tests/schedule-time-room-joint.test.ts tests/schedule-vocational-max-complex-corpus.test.ts
      - name: Run 21-case vocational maximum-complexity gate
        run: bun tools/schedule_vocational_max_complex_corpus.ts --seeds 7 --out /tmp/schedule-vocational-max-complex.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-vocational-max-complex-${{ github.sha }}
          path: /tmp/schedule-vocational-max-complex.json
          if-no-files-found: error
          retention-days: 90
