name: Okulos Desktop Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/lib/desktop-*.ts'
      - 'tests/desktop-*.test.ts'
      - 'package.json'
      - '.github/workflows/desktop-windows-build.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Desktop policy regression
        run: bun test tests/desktop-sync-policy.test.ts tests/desktop-command-contract.test.ts tests/desktop-solver-compute-policy.test.ts
      - name: Build web client assets
        run: bun run build
      - name: Verify desktop frontend payload
        shell: pwsh
        run: |
          if(!(Test-Path '.output/public')){throw 'DESKTOP_FRONTEND_DIST_MISSING'}
          if(!(Get-ChildItem '.output/public/assets' -Filter 'schedule-local-solver-worker-*.js')){throw 'DESKTOP_SOLVER_WORKER_MISSING'}
      - name: Build Tauri NSIS EXE
        run: bunx @tauri-apps/cli@2.11.4 build --config desktop/src-tauri/tauri.conf.json
      - name: Verify installable EXE
        shell: pwsh
        run: |
          $files=@(Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction Stop)
          if($files.Count -lt 1){throw 'DESKTOP_NSIS_EXE_MISSING'}
          $files|ForEach-Object{"OKULOS_DESKTOP_EXE $($_.FullName) $($_.Length)"}
      - uses: actions/upload-artifact@v4
        with:
          name: okulos-desktop-windows-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
