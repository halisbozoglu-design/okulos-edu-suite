name: FET world benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/schedule_fet_world_benchmark.ts
      - tests/schedule-fet-adapter.test.ts
      - .github/workflows/schedule-fet-benchmark.yml
permissions:
  contents: read
jobs:
  fet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Adapter regression
        run: bun test tests/schedule-fet-adapter.test.ts
      - name: Install official FET 7.10.2 executable
        run: |
          curl -fsSL https://lalescu.ro/liviu/fet/download/bin/fet-7.10.2-bin.tar.xz -o /tmp/fet-7.10.2-bin.tar.xz
          echo '983aef889f6afe8ace7fb1bd79e1bd82879a5f9291e5f052e83325336f74cc98  /tmp/fet-7.10.2-bin.tar.xz' | sha256sum -c -
          sudo mkdir -p /opt/fet-7.10.2
          sudo tar -xJf /tmp/fet-7.10.2-bin.tar.xz -C /opt/fet-7.10.2 --strip-components=1
          FET_CL="$(find /opt/fet-7.10.2 -type f -name fet-cl -perm -u+x | head -1)"
          test -n "$FET_CL"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$FET_CL" | sudo tee /usr/local/bin/fet-cl >/dev/null
          sudo chmod +x /usr/local/bin/fet-cl
          fet-cl --version --outputdir=/tmp/fet-version
      - name: Run real FET common-core benchmark
        run: bun tools/schedule_fet_world_benchmark.ts --ci --out /tmp/schedule-fet-world-benchmark.json
      - name: FET failure diagnostics
        if: failure()
        run: |
          set +e
          for f in /tmp/okulos-fet-*/logs/result.txt /tmp/okulos-fet-*/logs/max_placed_activities.txt /tmp/okulos-fet-*/logs/errors.txt /tmp/okulos-fet-*/logs/warnings.txt; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            head -80 "$f"
          done
          echo '--- sample directory ---'
          find /tmp/okulos-fet-synthetic-small-101 -maxdepth 4 -type f -print 2>/dev/null | head -80
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-fet-world-benchmark-${{ github.sha }}
          path: /tmp/schedule-fet-world-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
