name: FET world benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/schedule_fet_world_benchmark.ts
      - tests/schedule-fet-adapter.test.ts
      - .github/workflows/schedule-fet-benchmark.yml
permissions:
  contents: read
jobs:
  fet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Adapter regression
        run: bun test tests/schedule-fet-adapter.test.ts
      - name: Install FET executable
        run: sudo apt-get update -qq && sudo apt-get install -y fet && command -v fet-cl
      - name: Run real FET common-core benchmark
        run: bun tools/schedule_fet_world_benchmark.ts --ci --out /tmp/schedule-fet-world-benchmark.json
      - name: FET failure diagnostics
        if: failure()
        run: |
          set +e
          for f in /tmp/okulos-fet-*/logs/result.txt /tmp/okulos-fet-*/logs/max_placed_activities.txt /tmp/okulos-fet-*/logs/errors.txt /tmp/okulos-fet-*/logs/warnings.txt; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            head -80 "$f"
          done
          echo '--- sample directory ---'
          find /tmp/okulos-fet-synthetic-small-101 -maxdepth 4 -type f -print 2>/dev/null | head -80
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-fet-world-benchmark-${{ github.sha }}
          path: /tmp/schedule-fet-world-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
