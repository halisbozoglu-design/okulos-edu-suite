name: Schedule external same-runner parity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/world/**'
      - 'benchmarks/timefold-adapter/**'
      - 'benchmarks/unitime-adapter/**'
      - 'tools/schedule_world_benchmark.ts'
      - 'tools/schedule_world_export_cases.ts'
      - 'tools/schedule_fet_world_benchmark.ts'
      - 'tools/schedule_timefold_world_benchmark.ts'
      - 'tools/schedule_unitime_world_benchmark.ts'
      - 'tools/schedule_external_same_runner_report.ts'
      - '.github/workflows/schedule-external-same-runner.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            benchmarks/timefold-adapter/pom.xml
            benchmarks/unitime-adapter/pom.xml
      - run: bun install --frozen-lockfile
      - name: Install official FET 7.10.2
        run: |
          curl -fsSL https://lalescu.ro/liviu/fet/download/bin/fet-7.10.2-bin.tar.xz -o /tmp/fet-7.10.2-bin.tar.xz
          echo '983aef889f6afe8ace7fb1bd79e1bd82879a5f9291e5f052e83325336f74cc98  /tmp/fet-7.10.2-bin.tar.xz' | sha256sum -c -
          sudo mkdir -p /opt/fet-7.10.2
          sudo tar -xJf /tmp/fet-7.10.2-bin.tar.xz -C /opt/fet-7.10.2 --strip-components=1
          FET_CL="$(find /opt/fet-7.10.2 -type f -name fet-cl -perm -u+x | head -1)"
          test -n "$FET_CL"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$FET_CL" | sudo tee /usr/local/bin/fet-cl >/dev/null
          sudo chmod +x /usr/local/bin/fet-cl
          fet-cl --version --outputdir=/tmp/fet-version
      - name: Build Timefold adapter
        working-directory: benchmarks/timefold-adapter
        run: mvn -q -DskipTests package
      - name: Build pinned UniTime CPSolver
        run: |
          git clone -q https://github.com/UniTime/cpsolver.git /tmp/cpsolver
          git -C /tmp/cpsolver checkout -q 3abbcaaf26d739d25e45c8e191b7ef94bc15cc26
          mvn -q -f /tmp/cpsolver/pom.xml -DskipTests -Dmaven.javadoc.skip=true install
      - name: Build UniTime adapter
        working-directory: benchmarks/unitime-adapter
        run: mvn -q -DskipTests package
      - name: Export canonical cases
        run: bun tools/schedule_world_export_cases.ts --out /tmp/okulos-world-cases.ndjson
      - name: Run OkulOS
        run: bun tools/schedule_world_benchmark.ts --out /tmp/okulos-world.json
      - name: Run FET
        env:
          OKULOS_FET_BENCHMARK_VERSION: '7.10.2'
        run: bun tools/schedule_fet_world_benchmark.ts --ci --out /tmp/fet-world.json
      - name: Run Timefold
        run: java -jar benchmarks/timefold-adapter/target/timefold-world-benchmark-1.0.jar /tmp/okulos-world-cases.ndjson /tmp/timefold-raw.ndjson
      - name: Canonical post-score Timefold
        run: bun tools/schedule_timefold_world_benchmark.ts --cases /tmp/okulos-world-cases.ndjson --raw /tmp/timefold-raw.ndjson --out /tmp/timefold-world.json --ci
      - name: Run UniTime CPSolver
        run: java -jar benchmarks/unitime-adapter/target/unitime-world-benchmark-1.0.jar /tmp/okulos-world-cases.ndjson /tmp/unitime-raw.ndjson
      - name: Canonical post-score UniTime
        run: bun tools/schedule_unitime_world_benchmark.ts --cases /tmp/okulos-world-cases.ndjson --raw /tmp/unitime-raw.ndjson --out /tmp/unitime-world.json --ci
      - name: Same-runner parity gate
        run: bun tools/schedule_external_same_runner_report.ts --okulos /tmp/okulos-world.json --fet /tmp/fet-world.json --timefold /tmp/timefold-world.json --unitime /tmp/unitime-world.json --out /tmp/external-same-runner.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-external-same-runner-${{ github.sha }}
          path: |
            /tmp/okulos-world.json
            /tmp/fet-world.json
            /tmp/timefold-world.json
            /tmp/timefold-raw.ndjson
            /tmp/unitime-world.json
            /tmp/unitime-raw.ndjson
            /tmp/external-same-runner.json
          if-no-files-found: ignore
          retention-days: 30
