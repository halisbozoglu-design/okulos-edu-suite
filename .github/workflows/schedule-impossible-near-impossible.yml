name: Schedule impossible and boundary-feasible suite

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/schedule-local-solver-core.ts'
      - 'tools/schedule_impossible_near_impossible.ts'
      - 'tools/schedule_impossible_cpsat_oracle.py'
      - 'tests/schedule-impossible-near-impossible.test.ts'
      - 'tests/fixtures/schedule-impossible-near-impossible.json'
      - '.github/workflows/schedule-impossible-near-impossible.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/schedule-local-solver-core.ts'
      - 'tools/schedule_impossible_near_impossible.ts'
      - 'tools/schedule_impossible_cpsat_oracle.py'
      - 'tests/schedule-impossible-near-impossible.test.ts'
      - 'tests/fixtures/schedule-impossible-near-impossible.json'
      - '.github/workflows/schedule-impossible-near-impossible.yml'

permissions:
  contents: read

concurrency:
  group: schedule-impossible-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 5 impossible + 4 boundary-feasible cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic native suite
        run: bun tools/schedule_impossible_near_impossible.ts --out /tmp/schedule-impossible-suite.json
      - name: Run targeted regression tests
        run: bun test tests/schedule-impossible-near-impossible.test.ts
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed exact-oracle dependency
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206
      - name: Verify all classifications with CP-SAT
        run: python tools/schedule_impossible_cpsat_oracle.py | tee /tmp/schedule-impossible-cpsat.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-impossible-suite-${{ github.sha }}
          path: |
            /tmp/schedule-impossible-suite.json
            /tmp/schedule-impossible-cpsat.json
          if-no-files-found: error
          retention-days: 90
