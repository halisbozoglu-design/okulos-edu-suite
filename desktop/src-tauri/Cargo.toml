[package]
name = "okulos-desktop"
version = "0.1.0"
description = "Okulos desktop host"
authors = ["Okulos"]
edition = "2021"

[build-dependencies]
tauri-build = "2.6.0"

[dependencies]
tauri = "2.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
